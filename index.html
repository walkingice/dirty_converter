<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭計算器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .input-group, .family-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }
        .input-group label, .family-row label {
            margin-right: 10px;
        }
        .input-group input, .input-group select, .family-row select {
            margin-right: 20px;
            flex: 1;
            min-width: 100px;
        }
        .family-row button {
            margin-right: 20px;
        }
        .amount {
            flex: 1;
            min-width: 50px;
        }
        #add-family {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-group">
            <label for="cost">總金額：</label>
            <input type="number" id="cost" value="" placeholder="0">
        </div>
        <div class="input-group" id="condition">
            <label for="adult-base">大人基數:</label>
            <select id="adult-base">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
            <label for="child-base">小孩基數:</label>
            <select id="child-base">
                <option value="1" selected>1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
        </div>
        <div id="main_content">
            <div class="family-row">
                <button class="delete-row">刪除</button>
                <label>大人數量:</label>
                <select class="adult-count">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
                <label>小孩數量:</label>
                <select class="child-count">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
                <label>應付金額:</label>
                <span class="amount">0</span>
            </div>
            <div class="family-row">
                <button class="delete-row">刪除</button>
                <label>大人數量:</label>
                <select class="adult-count">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
                <label>小孩數量:</label>
                <select class="child-count">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
                <label>應付金額:</label>
                <span class="amount">0</span>
            </div>
        </div>
        <button id="add-family">增加家庭</button>
    </div>

    <script>
        function calculate() {
            const cost = parseFloat(document.getElementById('cost').value) || 0;
            const adultBase = parseInt(document.getElementById('adult-base').value);
            const childBase = parseInt(document.getElementById('child-base').value);

            const rows = document.querySelectorAll('.family-row');
            let totalUnits = 0;

            rows.forEach(row => {
                const adultCount = parseInt(row.querySelector('.adult-count').value);
                const childCount = parseInt(row.querySelector('.child-count').value);
                totalUnits += (adultCount * adultBase + childCount * childBase);
            });

            const baseUnit = totalUnits ? cost / totalUnits : 0;

            rows.forEach(row => {
                const adultCount = parseInt(row.querySelector('.adult-count').value);
                const childCount = parseInt(row.querySelector('.child-count').value);
                const amount = (adultCount * adultBase * baseUnit) + (childCount * childBase * baseUnit);
                row.querySelector('.amount').textContent = amount.toFixed(2);
            });
        }

        document.getElementById('cost').addEventListener('input', calculate);
        document.getElementById('adult-base').addEventListener('change', calculate);
        document.getElementById('child-base').addEventListener('change', calculate);

        document.getElementById('main_content').addEventListener('change', function(event) {
            if (event.target.matches('.adult-count') || event.target.matches('.child-count')) {
                calculate();
            }
        });

        document.getElementById('main_content').addEventListener('click', function(event) {
            if (event.target.matches('.delete-row')) {
                event.target.parentElement.remove();
                calculate();
            }
        });

        document.getElementById('add-family').addEventListener('click', function() {
            const newRow = document.createElement('div');
            newRow.className = 'family-row';
            newRow.innerHTML = `
                <button class="delete-row">刪除</button>
                <label>大人數量:</label>
                <select class="adult-count">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
                <label>小孩數量:</label>
                <select class="child-count">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
                <label>應付金額:</label>
                <span class="amount">0</span>
            `;
            document.getElementById('main_content').appendChild(newRow);
            calculate();
        });

        calculate(); // 初始化計算
    </script>
</body>
</html>
